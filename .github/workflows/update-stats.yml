name: Update Profile Stats

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile SVG cards
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 .github/scripts/generate_profile_stats.py

      - name: Commit updated SVG cards if changed
        run: |
          if git diff --quiet -- profile/*.svg; then
            echo "No changes to profile SVG cards."
            exit 0
          fi
          git config user.name "Mehdi Bouama"
          git config user.email "mahdidou711@gmail.com"
          git add profile/overview.svg profile/top-langs.svg
          git commit -m "chore: update profile stats SVGs"
          git push
